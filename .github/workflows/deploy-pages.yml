name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install vendored dependencies
        run: |
          mvn install:install-file -Dfile=repo/dev/arkturus/null-analysis/1.0.0/null-analysis-1.0.0.jar -DpomFile=repo/dev/arkturus/null-analysis/1.0.0/null-analysis-1.0.0.pom

      - name: Build Javadoc
        run: mvn compile javadoc:javadoc -B -DskipTests=true

      - name: Assemble Site
        run: |
          mkdir -p _site
          if [ -d "docs" ]; then
            cp -r docs/* _site/
          fi
          cp -r bin/site/apidocs _site/apidocs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
